<!DOCTYPE html>
<html>
  <head>
    <title>UniLink Video Extension</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js"></script>
  </head>
  <body>
    <div class="header">
      <h2>UniLink Video Extension</h2>
    </div>
    
    <div class="settings">
      <div class="setting-item">
        <label for="seekStep">Skip Step (seconds):</label>
        <input type="number" id="seekStep" min="1" max="500" />
      </div>
      
      <div class="setting-item">
        <label for="speedStep">Playback Rate Step:</label>
        <input type="number" id="speedStep" min="0.05" max="1" step="0.05" />
      </div>
    </div>
    
    <div class="buttons">
      <button id="reset">Reset to Default</button>
      <button id="save">Save Settings</button>
    </div>
    
    <div id="status" class="status hidden"></div>
  </body>
</html>
